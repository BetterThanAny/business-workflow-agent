[project]
name = "business-workflow-agent"
version = "0.1.0"
description = "Safe business workflow backend and fixed-schema tool executor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "prometheus-client>=0.23,<1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=6,<8",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/business_workflow_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires the local PostgreSQL integration service",
  "live: requires explicitly configured local or remote live services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportUnusedFunction = false

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
