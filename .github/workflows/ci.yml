name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://workflow@127.0.0.1:54329/workflow
      TEST_DATABASE_URL: postgresql+psycopg://workflow@127.0.0.1:54329/workflow
      REDIS_URL: redis://127.0.0.1:56379/0
      TEST_REDIS_URL: redis://127.0.0.1:56379/0
      JWT_SECRET: ci-only-randomized-test-secret-not-for-production
      KNOWLEDGE_BACKEND: deterministic_stub
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4.2.1
        with:
          install: true
          cache: true
      - name: Sync locked dependencies
        run: mise exec -- uv sync --frozen
      - name: Lint
        run: mise exec -- uv run ruff check .
      - name: Type check
        run: mise exec -- uv run pyright
      - name: Verify test inventory
        run: mise exec -- uv run pytest --collect-only -q -ra
      - name: Run full test suite with integration gates enabled
        run: >-
          mkdir -p artifacts &&
          mise exec -- uv run pytest -q -ra
          --cov=business_workflow_agent --cov-branch
          --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
          --cov-fail-under=92
      - name: Verify migrations
        run: |
          mise exec -- uv run alembic upgrade head
          mise exec -- uv run alembic current
          mise exec -- uv run alembic check
      - name: Run workflow smoke
        run: mise exec -- uv run python scripts/smoke_workflow.py
      - name: Run MCP smoke
        run: mise exec -- uv run python scripts/smoke_mcp.py
      - name: Run deterministic release gate
        run: >-
          mkdir -p artifacts &&
          mise exec -- uv run python scripts/evaluate_agent.py
          --dataset data/eval/agent_cases.jsonl
          --report artifacts/deterministic-report.json
      - name: Scan tracked content for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evidence
          path: |
            artifacts/coverage.xml
            artifacts/deterministic-report.json
